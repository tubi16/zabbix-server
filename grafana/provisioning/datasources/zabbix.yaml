apiVersion: 1

datasources:
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    uid: zabbix
    url: http://zabbix-web-nginx-mysql:8080/api_jsonrpc.php
    jsonData:
      username: ${ZABBIX_GRAFANA_USER}
      trends: true
      trendsFrom: 7d
      trendsRange: 4d
      cacheTTL: 1h
    secureJsonData:
      password: ${ZABBIX_GRAFANA_PASSWORD}
    isDefault: true
    editable: true

