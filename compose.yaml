name: staj-server

x-logging: &bounded-logging
 driver: json-file
 options:
  max-size: "10m"
  max-file: "3"

services:
 server-db-init:
  extends:
   file: compose/compose_zabbix_components.yaml
   service: server-mysql-db-init
  image: "${ZABBIX_SERVER_MYSQL_IMAGE}:${ZBX_IMAGE_TAG}"
  depends_on:
   mysql-server:
    condition: service_healthy
  labels:
   com.zabbix.os: "${OS}"

 proxy-db-init:
  extends:
   file: compose/compose_zabbix_components.yaml
   service: proxy-mysql-db-init
  image: "${ZABBIX_PROXY_MYSQL_IMAGE}:${ZBX_IMAGE_TAG}"
  depends_on:
   mysql-server:
    condition: service_healthy
  labels:
   com.zabbix.os: "${OS}"

 zabbix-server:
  logging: *bounded-logging
  extends:
   file: compose/compose_zabbix_components.yaml
   service: server-mysql
  image: "${ZABBIX_SERVER_MYSQL_IMAGE}:${ZBX_IMAGE_TAG}"
  depends_on:
   server-db-init:
    condition: service_completed_successfully
   mysql-server:
    condition: service_healthy
  labels:
   com.zabbix.os: "${OS}"

 zabbix-proxy-sqlite3:
  extends:
   file: compose/compose_zabbix_components.yaml
   service: proxy-sqlite3
  image: "${ZABBIX_PROXY_SQLITE3_IMAGE}:${ZBX_IMAGE_TAG}"
  labels:
   com.zabbix.os: "${OS}"

 zabbix-proxy-mysql:
  extends:
   file: compose/compose_zabbix_components.yaml
   service: proxy-mysql
  image: "${ZABBIX_PROXY_MYSQL_IMAGE}:${ZBX_IMAGE_TAG}"
  depends_on:
   proxy-db-init:
    condition: service_completed_successfully
   mysql-server:
    condition: service_healthy
  labels:
   com.zabbix.os: "${OS}"

 zabbix-web-apache-mysql:
  extends:
   file: compose/compose_zabbix_components.yaml
   service: web-apache-mysql
  image: "${ZABBIX_WEB_APACHE_MYSQL_IMAGE}:${ZBX_IMAGE_TAG}"
  depends_on:
   server-db-init:
    condition: service_completed_successfully
   mysql-server:
    condition: service_healthy
  labels:
   com.zabbix.os: "${OS}"

 zabbix-web-nginx-mysql:
  logging: *bounded-logging
  extends:
   file: compose/compose_zabbix_components.yaml
   service: web-nginx-mysql
  image: "${ZABBIX_WEB_NGINX_MYSQL_IMAGE}:${ZBX_IMAGE_TAG}"
  depends_on:
   server-db-init:
    condition: service_completed_successfully
   mysql-server:
    condition: service_healthy
  labels:
   com.zabbix.os: "${OS}"

 zabbix-java-gateway:
  extends:
   file: compose/compose_zabbix_components.yaml
   service: java-gateway
  image: "${ZABBIX_JAVA_GATEWAY_IMAGE}:${ZBX_IMAGE_TAG}"
  labels:
   com.zabbix.os: "${OS}"

 zabbix-snmptraps:
  extends:
   file: compose/compose_zabbix_components.yaml
   service: snmptraps
  image: "${ZABBIX_SNMPTRAPS_IMAGE}:${ZBX_IMAGE_TAG}"
  labels:
   com.zabbix.os: "${OS}"

 zabbix-web-service:
  extends:
   file: compose/compose_zabbix_components.yaml
   service: web-service
  image: "${ZABBIX_WEB_SERVICE_IMAGE}:${ZBX_IMAGE_TAG}"
  labels:
   com.zabbix.os: "${OS}"

 mysql-server:
  logging: *bounded-logging
  extends:
   file: compose/compose_databases.yaml
   service: mysql-server

 elasticsearch:
  extends:
   file: compose/compose_databases.yaml
   service: elasticsearch

 selenium:
  extends:
   file: compose/compose_additional_components.yaml
   service: selenium

 selenium-chrome:
  platform: linux/amd64
  extends:
   file: compose/compose_additional_components.yaml
   service: selenium-chrome

 selenium-firefox:
  extends:
   file: compose/compose_additional_components.yaml
   service: selenium-firefox

 grafana:
  logging: *bounded-logging
  image: "${GRAFANA_IMAGE:-grafana/grafana}:${GRAFANA_IMAGE_TAG:-latest}"
  restart: "${RESTART_POLICY}"
  ports:
   - name: grafana-http
     host_ip: "${GRAFANA_BIND_IP:-0.0.0.0}"
     target: 3000
     published: "${GRAFANA_PORT:-3000}"
     protocol: tcp
     app_protocol: http
  env_file:
   - path: ${ENV_VARS_DIRECTORY}/.env_grafana
     required: false
  environment:
   - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
   - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
   - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-}
   - ZABBIX_GRAFANA_USER=${ZABBIX_GRAFANA_USER:-Admin}
   - ZABBIX_GRAFANA_PASSWORD=${ZABBIX_GRAFANA_PASSWORD:-${ZABBIX_ADMIN_PASSWORD:-}}
  volumes:
   - grafana-storage:/var/lib/grafana
   - ./grafana/provisioning:/etc/grafana/provisioning:ro
   - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
  networks:
   backend:
    aliases:
     - grafana
   frontend:
   database:
  depends_on:
   mysql-server:
    condition: service_healthy
   zabbix-server:
    condition: service_started

 host-dashboard-sync:
  logging: *bounded-logging
  image: python:3.13-alpine
  profiles: [host-sync]
  restart: "${RESTART_POLICY}"
  command: [python, -B, /app/sync.py]
  environment:
   GRAFANA_SERVICE_TOKEN: "${GRAFANA_SERVICE_TOKEN:-}"
   ZABBIX_SERVICE_TOKEN: "${ZABBIX_SERVICE_TOKEN:-}"
  read_only: true
  cap_drop: [ALL]
  security_opt:
   - no-new-privileges:true
  env_file:
   - path: ./env_vars/.env_dashboard_sync
     required: false
  volumes:
   - ./grafana/host-sync/sync.py:/app/sync.py:ro
   - ./grafana/templates/linux-template.json:/app/template.json:ro
   - ./grafana/host-sync/secrets:/run/secrets:ro
  networks:
   - backend
  depends_on:
   grafana:
    condition: service_started
   zabbix-web-nginx-mysql:
    condition: service_healthy

networks:
  frontend:
    driver: bridge
    enable_ipv6: "${FRONTEND_ENABLE_IPV6}"
    ipam:
      driver: "${FRONTEND_NETWORK_DRIVER}"
      config:
      - subnet: "${FRONTEND_SUBNET}"
  backend:
    driver: bridge
    enable_ipv6: "${BACKEND_ENABLE_IPV6}"
    internal: true
    ipam:
      driver: "${BACKEND_NETWORK_DRIVER}"
      config:
      - subnet: "${BACKEND_SUBNET}"
  database:
    driver: bridge
    enable_ipv6: "${DATABASE_NETWORK_ENABLE_IPV6}"
    internal: true
    ipam:
      driver: "${DATABASE_NETWORK_DRIVER}"
  tools_frontend:
    driver: bridge
    enable_ipv6: "${ADD_TOOLS_ENABLE_IPV6}"
    ipam:
      driver: "${ADD_TOOLS_NETWORK_DRIVER}"
      config:
      - subnet: "${ADD_TOOLS_SUBNET}"

volumes:
  snmptraps: {}
  grafana-storage: {}
#  mysql_socket: {}

secrets:
  MYSQL_USER:
    file: ${ENV_VARS_DIRECTORY}/.MYSQL_USER
  MYSQL_PASSWORD:
    file: ${ENV_VARS_DIRECTORY}/.MYSQL_PASSWORD
  MYSQL_ROOT_USER:
    file: ${ENV_VARS_DIRECTORY}/.MYSQL_ROOT_USER
  MYSQL_ROOT_PASSWORD:
    file: ${ENV_VARS_DIRECTORY}/.MYSQL_ROOT_PASSWORD
#  client-key.pem:
#    file: ${ENV_VARS_DIRECTORY}/.ZBX_DB_KEY_FILE
#  client-cert.pem:
#    file: ${ENV_VARS_DIRECTORY}/.ZBX_DB_CERT_FILE
#  root-ca.pem:
#    file: ${ENV_VARS_DIRECTORY}/.ZBX_DB_CA_FILE
#  server-cert.pem:
#    file: ${ENV_VARS_DIRECTORY}/.DB_CERT_FILE
#  server-key.pem:
#    file: ${ENV_VARS_DIRECTORY}/.DB_KEY_FILE

