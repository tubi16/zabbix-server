zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 7df96b18c230490a9a0a9e2307226338
    name: Templates
  templates:
  - uuid: b9d5c1cfeb054bffbd1e34370b5d61d2
    template: Essential Items Windows
    name: Essential Items Windows
    description: Essential Windows metrics for Zabbix agent 7.4+. Passive checks. Configurable system drive and network interface
      discovery; no helper scripts.
    groups:
    - name: Templates
    items:
    - uuid: f2e37a3181f140169aec4a3fd48e3b50
      name: CPU Utilization
      key: system.cpu.util
      value_type: FLOAT
      units: '%'
      triggers:
      - uuid: 87cb5cef6d024bdeb29da47620795428
        expression: min(/Essential Items Windows/system.cpu.util,5m)>{$CPU.UTIL.HIGH}
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: max(/Essential Items Windows/system.cpu.util,5m)<{$CPU.UTIL.RECOVERY}
        name: CPU utilization above {$CPU.UTIL.HIGH}% for 5m
        priority: WARNING
        tags:
        - tag: notify
          value: telegram
    - uuid: 2dc23a8be0ea469caa489467ae791637
      name: Processes
      key: proc.get[,,,summary]
      value_type: TEXT
    - uuid: ef92894e121d4c3c8ac0435920d5159c
      name: CPU Load
      key: system.cpu.load
      value_type: FLOAT
      description: Windows processor queue length; not the Unix load average.
    - uuid: 5c13a8dc201f43cbb5380353b0c19c11
      name: Operating System
      key: system.sw.os.get
      value_type: TEXT
    - uuid: bb609a5e7e00400eb8330ccbb3e84f51
      name: System Uptime
      key: system.uptime
      units: uptime
      description: Time since the operating system started, in seconds.
      triggers:
      - uuid: 97772e0b97a644248fca3ed3548bcf15
        expression: nodata(/Essential Items Windows/system.uptime,{$AGENT.NODATA})=1
        name: No agent data for {$AGENT.NODATA}
        priority: HIGH
        description: No uptime samples received. Check host, agent, proxy and connectivity; this does not by itself prove
          the host is down.
        tags:
        - tag: notify
          value: telegram
      - uuid: 62e9abcb6a074ef390d47154dc1b46fe
        expression: last(/Essential Items Windows/system.uptime)<10m
        name: Host restarted within the last 10m
        priority: INFO
        tags:
        - tag: notify
          value: telegram
    - uuid: 3c25d4c34f0444e58a29d6d0876f433d
      name: Disk Usage
      key: vfs.fs.size[{$WINDOWS.SYSTEM.DRIVE},pused]
      value_type: FLOAT
      units: '%'
      triggers:
      - uuid: 116871d2e70049919063b92b7de40d81
        expression: min(/Essential Items Windows/vfs.fs.size[{$WINDOWS.SYSTEM.DRIVE},pused],5m)>{$DISK.USED.HIGH}
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: max(/Essential Items Windows/vfs.fs.size[{$WINDOWS.SYSTEM.DRIVE},pused],5m)<{$DISK.USED.RECOVERY}
        name: System drive usage above {$DISK.USED.HIGH}% for 5m
        priority: HIGH
        tags:
        - tag: notify
          value: telegram
      description: 'Used space on the configured Windows system drive (C: by default).'
    - uuid: 4d08f075ccba4803b83a01be4ec8e5d5
      name: Available Memory
      key: vm.memory.size[pavailable]
      value_type: FLOAT
      units: '%'
      description: The available memory as percentage of the total. See also Appendixes in Zabbix Documentation about parameters
        of the `vm.memory.size` item.
      triggers:
      - uuid: b537ff7735794cd4aeffdc91d2fa69fc
        expression: max(/Essential Items Windows/vm.memory.size[pavailable],5m)<{$MEM.AVAILABLE.LOW}
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: min(/Essential Items Windows/vm.memory.size[pavailable],5m)>{$MEM.AVAILABLE.RECOVERY}
        name: Available memory below {$MEM.AVAILABLE.LOW}% for 5m
        priority: WARNING
        tags:
        - tag: notify
          value: telegram
    discovery_rules:
    - uuid: ba281a59363b467da792890d28c34820
      name: Windows network interface discovery
      key: net.if.discovery
      lifetime_type: DELETE_NEVER
      enabled_lifetime_type: DISABLE_IMMEDIATELY
      description: Discovers interfaces matching the host macros. Traffic is collected separately per interface; this does
        not select the default route.
      item_prototypes:
      - uuid: b196e60974fc4c088aff5807f7843ed8
        name: 'Active Download Speed: {#IFNAME}'
        key: net.if.in["{#IFNAME}",bytes]
        delay: 30s
        value_type: FLOAT
        units: Bps
        description: Traffic on the discovered Windows interface {#IFNAME}.
        preprocessing:
        - type: CHANGE_PER_SECOND
      - uuid: aa7d29c5fecd414eb85fce8aff39dd94
        name: 'Active Upload Speed: {#IFNAME}'
        key: net.if.out["{#IFNAME}",bytes]
        delay: 30s
        value_type: FLOAT
        units: Bps
        description: Traffic on the discovered Windows interface {#IFNAME}.
        preprocessing:
        - type: CHANGE_PER_SECOND
      delay: 1m
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.MATCHES}'
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
    - uuid: 942ae3fcfa8c4b8abab7deb9b8ac07fe
      name: proc.discovery
      type: DEPENDENT
      key: proc.discovery
      item_prototypes:
      - uuid: 8dc71b29c7b24fd28e588c02a38d5de9
        name: 'Process count: {#PNAME}'
        type: DEPENDENT
        key: proc.count[{#PNAME}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.name=="{#PNAME}")].processes.first()
        master_item:
          key: proc.get[,,,summary]
      - uuid: 2fa7d25501c64b0fa5b010137e8c4257
        name: 'Process user CPU time rate: {#PNAME}'
        type: DEPENDENT
        key: proc.cpu[{#PNAME}]
        value_type: FLOAT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.name=="{#PNAME}")].cputime_user.first()
        - type: MULTIPLIER
          parameters:
          - '0.001'
        - type: CHANGE_PER_SECOND
        master_item:
          key: proc.get[,,,summary]
        description: User CPU seconds per second, converted from Windows milliseconds; not normalized by CPU count.
      - uuid: 7410f7b2541e4ac6a549384ced72771f
        name: 'Memory (working set): {#PNAME}'
        type: DEPENDENT
        key: proc.wkset[{#PNAME}]
        units: B
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.name=="{#PNAME}")].wkset.first()
        master_item:
          key: proc.get[,,,summary]
      master_item:
        key: proc.get[,,,summary]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var d = JSON.parse(value);

          return JSON.stringify(d.map(function (p) { return {"{#PNAME}": p.name}; }));

          '
    macros:
    - macro: '{$CPU.UTIL.HIGH}'
      value: '90'
    - macro: '{$CPU.UTIL.RECOVERY}'
      value: '80'
    - macro: '{$DISK.USED.HIGH}'
      value: '90'
    - macro: '{$DISK.USED.RECOVERY}'
      value: '85'
    - macro: '{$MEM.AVAILABLE.LOW}'
      value: '10'
    - macro: '{$MEM.AVAILABLE.RECOVERY}'
      value: '15'
    - macro: '{$AGENT.NODATA}'
      value: 5m
    - macro: '{$NET.IF.IFNAME.MATCHES}'
      value: ^.*$
    - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
      value: (^Software Loopback Interface|^Loopback Pseudo-Interface|^isatap[.]|^Teredo)
    - macro: '{$WINDOWS.SYSTEM.DRIVE}'
      value: 'C:'
